name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build standalone WebView APK
        env:
          SIGNING_CONFIG: ${{ secrets.ANDROID_SIGNING_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_CONFIG" ]; then
            echo '::error::Configure the ANDROID_SIGNING_CONFIG repository secret before building.'
            exit 1
          fi
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          BT="$SDK/build-tools/35.0.0"
          JAR="$SDK/platforms/android-35/android.jar"
          mkdir -p build/assets build/classes build/dex build/res/drawable
          cp index.html build/assets/index.html
          cat > build/res/drawable/app_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
          <path android:fillColor="#9ACB8B" android:pathData="M0,0H108V108H0Z"/>
          <path android:fillColor="#C8E6A8" android:pathData="M0,83Q28,64 53,81T108,74V108H0Z"/>
          <path android:fillColor="#4B8BC8" android:strokeColor="#343A48" android:strokeWidth="3" android:pathData="M23,66Q12,76 21,90H61Q74,76 61,66Z"/>
          <path android:fillColor="#8ED0F6" android:strokeColor="#343A48" android:strokeWidth="3.5" android:pathData="M14,51Q12,18 41,15Q70,14 72,43L71,62Q62,75 41,75Q17,74 14,51Z"/>
          <path android:fillColor="#FFF0CB" android:strokeColor="#343A48" android:strokeWidth="2.5" android:pathData="M22,45Q43,39 64,45V59Q61,68 43,68Q26,68 22,59Z"/>
          <path android:fillColor="#343A48" android:pathData="M30,52a3,5 0,1 0,6 0a3,5 0,1 0,-6 0M49,52a3,5 0,1 0,6 0a3,5 0,1 0,-6 0"/>
          <path android:fillColor="#D3EFFF" android:pathData="M23,33Q30,22 42,22Q46,23 42,27Q31,28 27,37Z"/>
          <path android:fillColor="#F4A056" android:strokeColor="#343A48" android:strokeWidth="3" android:strokeLineJoin="round" android:pathData="M66,70Q58,49 72,53L77,61L86,49L91,63Q104,71 97,84Q94,93 81,93Q65,94 63,83Z"/>
          <path android:fillColor="#343A48" android:pathData="M72,74a2.6,3.5 0,1 0,5.2 0a2.6,3.5 0,1 0,-5.2 0M85,74a2.6,3.5 0,1 0,5.2 0a2.6,3.5 0,1 0,-5.2 0"/>
          <path android:strokeColor="#343A48" android:strokeWidth="2" android:strokeLineCap="round" android:pathData="M78,83Q81,86 84,83"/>
          </vector>
          EOF
          cat > build/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.morphies.miniarena" android:versionCode="5" android:versionName="0.3-alpha.3">
            <uses-sdk android:minSdkVersion="23" android:targetSdkVersion="35"/>
            <uses-permission android:name="android.permission.VIBRATE"/>
            <application android:label="MORPHIES" android:theme="@android:style/Theme.Material.Light.NoActionBar" android:allowBackup="false" android:icon="@drawable/app_icon" android:roundIcon="@drawable/app_icon">
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > build/MainActivity.java <<'EOF'
          package com.morphies.miniarena;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.View;
          public class MainActivity extends Activity {
            WebView game;
            @Override public void onCreate(Bundle state) {
              super.onCreate(state);
              game = new WebView(this);
              game.setWebViewClient(new WebViewClient());
              game.getSettings().setJavaScriptEnabled(true);
              game.getSettings().setDomStorageEnabled(true);
              game.getSettings().setAllowFileAccess(true);
              game.getSettings().setAllowContentAccess(false);
              game.getSettings().setMediaPlaybackRequiresUserGesture(true);
              setContentView(game);
              getWindow().getDecorView().setSystemUiVisibility(5894);
              game.loadUrl("file:///android_asset/index.html");
            }
            @Override protected void onPause(){super.onPause();if(game!=null){game.onPause();game.pauseTimers();}}
            @Override protected void onResume(){super.onResume();if(game!=null){game.onResume();game.resumeTimers();}}
          }
          EOF
          javac -source 8 -target 8 -classpath "$JAR" -d build/classes build/MainActivity.java
          "$BT/d8" --lib "$JAR" --min-api 23 --output build/dex build/classes/com/morphies/miniarena/MainActivity.class
          "$BT/aapt2" compile --dir build/res -o build/resources.zip
          "$BT/aapt2" link -I "$JAR" --manifest build/AndroidManifest.xml -A build/assets -o build/unsigned.apk build/resources.zip
          (cd build/dex && zip -j ../unsigned.apk classes.dex)
          "$BT/zipalign" -f -p 4 build/unsigned.apk build/aligned.apk
          umask 077
          trap 'rm -f build/signing.p12' EXIT
          python3 - <<'PY'
          import base64, json, os
          cfg = json.loads(os.environ["SIGNING_CONFIG"])
          with open("build/signing.p12", "wb") as f:
              f.write(base64.b64decode(cfg["keystore"], validate=True))
          PY
          export KS_PASS="$(python3 -c 'import json, os; print(json.loads(os.environ["SIGNING_CONFIG"])["password"])')"
          echo "::add-mask::$KS_PASS"
          unset SIGNING_CONFIG
          "$BT/apksigner" sign --ks build/signing.p12 --ks-key-alias game-release --ks-pass env:KS_PASS --key-pass env:KS_PASS --out build/MORPHIES-v0.3-alpha3.apk build/aligned.apk
          unset KS_PASS
          "$BT/apksigner" verify --verbose --print-certs build/MORPHIES-v0.3-alpha3.apk | tee build/cert-check.txt
          grep -Fqi 'certificate SHA-256 digest: a4acf0e65a1de09559ad5967261f21f33e460d682a4c5c933bed30a0c3985419' build/cert-check.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MORPHIES-Android-v0.3
          path: build/MORPHIES-v0.3-alpha3.apk
      - name: Publish direct APK for testing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-0.3-alpha.3-${{ github.run_id }}" "build/MORPHIES-v0.3-alpha3.apk" --title "MORPHIES 0.3-alpha.3 Android test" --notes "Test version signed with the dedicated persistent game key; not a Google Play release." --prerelease
