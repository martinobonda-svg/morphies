name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'art/**'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build standalone WebView APK
        env:
          SIGNING_CONFIG: ${{ secrets.ANDROID_SIGNING_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_CONFIG" ]; then
            echo '::error::Configure the ANDROID_SIGNING_CONFIG repository secret before building.'
            exit 1
          fi
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          BT="$SDK/build-tools/35.0.0"
          JAR="$SDK/platforms/android-35/android.jar"
          mkdir -p build/assets build/classes build/dex build/res/drawable
          python3 - <<'PY'
          import base64, json, pathlib
          src = pathlib.Path('index.html').read_text()
          art = json.loads(pathlib.Path('art/sprites.json').read_text())
          assert '/*__ART_BUNDLE__*/{}' in src
          src = src.replace('/*__ART_BUNDLE__*/{}',json.dumps(art,separators=(',',':')),1)
          pathlib.Path('build/assets/index.html').write_text(src)
          pathlib.Path('build/res/drawable-nodpi').mkdir(parents=True,exist_ok=True)
          pathlib.Path('build/res/drawable-nodpi/app_icon.png').write_bytes(base64.b64decode(json.loads(pathlib.Path('art/launcher.json').read_text())['png'],validate=True))
          PY
          cat > build/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.morphies.miniarena" android:versionCode="6" android:versionName="0.4-alpha.1">
            <uses-sdk android:minSdkVersion="23" android:targetSdkVersion="35"/>
            <uses-permission android:name="android.permission.VIBRATE"/>
            <application android:label="MORPHIES" android:theme="@android:style/Theme.Material.Light.NoActionBar" android:allowBackup="false" android:icon="@drawable/app_icon" android:roundIcon="@drawable/app_icon">
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > build/MainActivity.java <<'EOF'
          package com.morphies.miniarena;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.View;
          public class MainActivity extends Activity {
            WebView game;
            @Override public void onCreate(Bundle state) {
              super.onCreate(state);
              game = new WebView(this);
              game.setWebViewClient(new WebViewClient());
              game.getSettings().setJavaScriptEnabled(true);
              game.getSettings().setDomStorageEnabled(true);
              game.getSettings().setAllowFileAccess(true);
              game.getSettings().setAllowContentAccess(false);
              game.getSettings().setMediaPlaybackRequiresUserGesture(true);
              setContentView(game);
              getWindow().getDecorView().setSystemUiVisibility(5894);
              game.loadUrl("file:///android_asset/index.html");
            }
            @Override protected void onPause(){super.onPause();if(game!=null){game.onPause();game.pauseTimers();}}
            @Override protected void onResume(){super.onResume();if(game!=null){game.onResume();game.resumeTimers();}}
          }
          EOF
          javac -source 8 -target 8 -classpath "$JAR" -d build/classes build/MainActivity.java
          "$BT/d8" --lib "$JAR" --min-api 23 --output build/dex build/classes/com/morphies/miniarena/MainActivity.class
          "$BT/aapt2" compile --dir build/res -o build/resources.zip
          "$BT/aapt2" link -I "$JAR" --manifest build/AndroidManifest.xml -A build/assets -o build/unsigned.apk build/resources.zip
          (cd build/dex && zip -j ../unsigned.apk classes.dex)
          "$BT/zipalign" -f -p 4 build/unsigned.apk build/aligned.apk
          umask 077
          trap 'rm -f build/signing.p12' EXIT
          python3 - <<'PY'
          import base64, json, os
          cfg = json.loads(os.environ["SIGNING_CONFIG"])
          with open("build/signing.p12", "wb") as f:
              f.write(base64.b64decode(cfg["keystore"], validate=True))
          PY
          export KS_PASS="$(python3 -c 'import json, os; print(json.loads(os.environ["SIGNING_CONFIG"])["password"])')"
          echo "::add-mask::$KS_PASS"
          unset SIGNING_CONFIG
          "$BT/apksigner" sign --ks build/signing.p12 --ks-key-alias game-release --ks-pass env:KS_PASS --key-pass env:KS_PASS --out build/MORPHIES-v0.4-alpha1.apk build/aligned.apk
          unset KS_PASS
          "$BT/apksigner" verify --verbose --print-certs build/MORPHIES-v0.4-alpha1.apk | tee build/cert-check.txt
          grep -Fqi 'certificate SHA-256 digest: a4acf0e65a1de09559ad5967261f21f33e460d682a4c5c933bed30a0c3985419' build/cert-check.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MORPHIES-Android-v0.4
          path: build/MORPHIES-v0.4-alpha1.apk
      - name: Publish direct APK for testing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-0.4-alpha.1-${{ github.run_id }}" "build/MORPHIES-v0.4-alpha1.apk" --title "MORPHIES 0.4-alpha.1 Android test" --notes "Illustrated visual update. Persistent signing certificate checked. Not a Google Play release." --prerelease
